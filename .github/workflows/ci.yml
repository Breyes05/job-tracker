name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  docker:
    # Only build the image once the tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres and the API
        run: docker compose up -d --build
      - name: Smoke test the running stack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          # Registering writes to Postgres, so this fails if migrations didn't run.
          curl -sf -X POST http://localhost:8000/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email": "ci@example.com", "password": "password123"}'
      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs
